name: security

# Public repo with a personal-health focus: catch leaked secrets and
# vulnerable dependencies on every PR, and weekly for CVEs published
# after the code last changed.
on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install package and pip-audit
        run: |
          pip install --upgrade pip setuptools
          pip install -e . pip-audit
      # PYSEC-2026-3467 (garminconnect <= 0.3.4 writes its token store
      # world-readable): no fixed release on PyPI yet; mitigated by
      # GarminClient._restrict_token_store. Drop the ignore once
      # garminconnect >= 0.3.5 ships.
      - name: Audit dependencies
        run: pip-audit --skip-editable --ignore-vuln PYSEC-2026-3467
