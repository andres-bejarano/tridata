[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tridata"
version = "0.1.0"
description = "Pull your Garmin Connect data and hand it to Claude for free analysis — no paid connectors required."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andrés Bejarano" }]
dependencies = [
    "garminconnect>=0.2.8",
    "garth>=0.4.46",
    "python-dotenv>=1.0.0",
    # Google Calendar (unit 043): the sessions of the plan in the calendar «TriData», permission
    # `calendar.app.created` only. Pinned; Dependabot proposes the updates.
    "google-api-python-client==2.201.0",
    "google-auth-oauthlib==1.5.0",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3"]
# Food log web app (`tridata web`): Claude API client, ASGI app and server.
# starlette 1.8 needs Python 3.11; 1.7 is the newest that still runs on 3.10.
app = ["anthropic>=1.15,<3", "starlette>=1.7", "uvicorn>=0.54"]
# Dictation (`tridata web`, unit 006): Whisper large-v3-turbo on the GPU. Not in `dev`: the tests use a
# double and CI must not download ~1.4 GB of CUDA libraries. Tested with faster-whisper 1.2.1,
# ctranslate2 4.8.3, av 18.1.0, nvidia-cublas-cu12 12.9.2.10 and nvidia-cudnn-cu12 9.27.0.42.
voz = ["faster-whisper>=1.2,<2", "nvidia-cublas-cu12>=12.4,<13", "nvidia-cudnn-cu12>=9,<10"]
# E2E of the phone screen (unit 010, tests/e2e/): Playwright with its Chromium. Not in `dev` and not in
# the remote CI (≈150 MB of browser for every PR); without it tests/e2e/ is skipped. Tested with 1.48.0.
e2e = ["playwright>=1.48,<2"]
dev = [
    "pytest>=8.0.0", "mcp>=2.3", "ruff>=0.17", "mypy>=1.10", "pip-audit>=2.7",
    "anthropic>=1.15,<3", "starlette>=1.7", "uvicorn>=0.54",
]

[project.scripts]
tridata = "tridata.cli:main"
tridata-mcp = "tridata.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tridata.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# E/F: errors, B: likely bugs, S: security (bandit), UP: modern syntax
select = ["E", "F", "B", "S", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is how pytest tests

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
