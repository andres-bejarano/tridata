<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>TriData · Ajustes</title>
  <link rel="stylesheet" href="/static/estilos.css">
  <script type="module" src="/static/ajustes.js"></script>
</head>
<body>
  <main class="ajustes">
    <header class="cabecera">
      <a href="/" class="enlace">◀ Hoy</a>
      <h1>Ajustes</h1>
    </header>
    <p class="suave">Cada dato vale desde la fecha que digas. Los días anteriores siguen con lo que valía entonces.</p>

    <section aria-labelledby="t-perfil">
      <h2 id="t-perfil">Perfil</h2>
      <div id="perfil"></div>
    </section>

    <section aria-labelledby="t-plan">
      <h2 id="t-plan">Plan</h2>
      <p id="plan-hoy" class="suave"></p>
      <div id="pregunta-limite"></div>
      <div id="plan"></div>
    </section>

    <section aria-labelledby="t-carreras">
      <h2 id="t-carreras">Carreras</h2>
      <p class="suave">El día de la carrera y los días de mantenimiento antes, el plan es 0 %.</p>
      <div id="carreras"></div>
      <p id="sin-carreras" class="suave">No tienes carreras apuntadas.</p>
      <div id="carrera-nueva"></div>
      <button id="anadir-carrera" type="button" class="anadir">Añadir carrera</button>
    </section>

    <p id="mensaje" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
