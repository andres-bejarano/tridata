<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f2f3f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1115" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TriData">
  <title>TriData · Ajustes</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" href="/static/icono.svg" type="image/svg+xml">
  <link rel="icon" href="/static/icono-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/icono-180.png">
  <link rel="stylesheet" href="/static/estilos.css">
  <script type="module" src="/static/ajustes.js"></script>
</head>
<body>
  <main class="ajustes">
    <h1 class="titulo-pantalla">Ajustes</h1>
    <p class="nota">Cada dato vale desde la fecha que digas; los días anteriores siguen con lo que valía entonces.</p>
    <p id="mensaje" role="status" aria-live="polite"></p>

    <h2 id="t-perfil">Perfil</h2>
    <article id="perfil" class="tarjeta grupo" aria-labelledby="t-perfil"></article>

    <h2 id="t-plan">Plan</h2>
    <p id="plan-hoy" class="nota"></p>
    <div id="pregunta-limite"></div>
    <article id="plan" class="tarjeta grupo" aria-labelledby="t-plan"></article>

    <h2 id="t-carreras">Carreras</h2>
    <p class="nota">El día de la carrera y los días de mantenimiento antes, el plan es 0 %.</p>
    <article class="tarjeta grupo" aria-labelledby="t-carreras">
      <div id="carreras"></div>
      <p id="sin-carreras" class="suave nota-grupo">No tienes carreras apuntadas.</p>
      <div id="carrera-nueva"></div>
      <button id="anadir-carrera" type="button" class="ajuste accion"><span class="que">＋ Añadir carrera</span></button>
    </article>

    <h2 id="t-conexion">Conexión</h2>
    <article class="tarjeta grupo" aria-labelledby="t-conexion">
      <div id="conexion" class="ajuste estado">
        <span class="que estado-pc"><span id="conexion-punto" class="punto apagado"></span>PC de casa</span>
        <span id="conexion-valor" class="valor suave">comprobando…</span>
      </div>
    </article>
  </main>

  <div id="abajo" class="abajo">
    <nav class="pestanas" aria-label="Pantallas">
      <a class="pestana" href="/#hoy" data-ir="hoy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="7.5"/><path d="M12 8v4l2.5 2"/></svg>Hoy</a>
      <a class="pestana" href="/#balance" data-ir="balance">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16"/><path d="M7 12V6"/><path d="M12 12v4"/><path d="M17 12V8"/><path d="M4 20h16"/></svg>Balance</a>
      <a class="pestana" href="/#peso" data-ir="peso">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M7.5 11a4.5 4.5 0 0 1 9 0"/><path d="M12 11l1.8-2.6"/><path d="M8 16h8"/></svg>Peso</a>
      <a class="pestana" href="/#recetas" data-ir="recetas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/><path d="M9 8h6M9 12h6"/></svg>Recetas</a>
      <a class="pestana" href="/ajustes" data-ir="ajustes" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Ajustes</a>
    </nav>
  </div>
</body>
</html>
