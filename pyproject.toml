[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tridata"
version = "0.1.0"
description = "Pull your Garmin Connect data and hand it to Claude for free analysis — no paid connectors required."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andrés Bejarano" }]
dependencies = [
    "garminconnect>=0.2.8",
    "garth>=0.4.46",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3"]
# Food log web app (`tridata web`): Claude API client, ASGI app and server.
app = ["anthropic>=1.15,<2", "starlette>=1.8", "uvicorn>=0.54"]
dev = [
    "pytest>=8.0.0", "mcp>=2.3", "ruff>=0.17", "mypy>=1.10", "pip-audit>=2.7",
    "anthropic>=1.15,<2", "starlette>=1.8", "uvicorn>=0.54",
]

[project.scripts]
tridata = "tridata.cli:main"
tridata-mcp = "tridata.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tridata.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# E/F: errors, B: likely bugs, S: security (bandit), UP: modern syntax
select = ["E", "F", "B", "S", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is how pytest tests

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
