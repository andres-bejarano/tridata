name: quality-security

# Lint/types and security in parallel, with the same scripts as locally
# (see AGENTS.md). Public repo with a personal-health focus: catch leaked
# secrets and vulnerable dependencies on every PR, on every push to the main
# branch, and weekly for CVEs published after the code last changed.
on:
  pull_request:
  push:
    branches: [master, main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install package with dev dependencies
        run: pip install -e .[dev]
      - name: ruff (incl. bandit security rules) and mypy
        run: scripts/ci/lint

  security:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install gitleaks (pinned, SHA-256 checked)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install package with dev dependencies
        run: |
          pip install --upgrade pip setuptools
          pip install -e .[dev]
      - name: gitleaks and pip-audit
        run: scripts/ci/security

  quality-security:
    runs-on: ubuntu-latest
    needs: [lint, security]
    if: always()
    steps:
      - name: Require lint and security
        run: |
          echo "lint: ${{ needs.lint.result }} · security: ${{ needs.security.result }}"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.security.result }}" = "success"
